<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Brawler 2P (Voice Chat) - ArcadePlay</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #080a12;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 40px;
      background: #111522;
      border-bottom: 1px solid #252938;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 50;
    }
    .title { color: #ff3948; font-size: 14px; font-weight: bold; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-mic {
      background: #28a745; color: #fff; border: none;
      padding: 4px 8px; border-radius: 5px; font-size: 11px;
      font-weight: bold; cursor: pointer; display: none;
    }
    .btn-mic.muted { background: #555; }
    .btn-fs {
      background: #ff3948; color: #fff; border: none;
      padding: 4px 10px; border-radius: 5px; font-size: 12px;
      font-weight: bold; cursor: pointer;
    }
    .btn-back { color: #bbb; text-decoration: none; font-size: 12px; }

    #room-bar {
      background: #181d2d;
      border-bottom: 1px solid #2e354b;
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 45;
    }
    .btn-m {
      background: #ff3948; color: #fff; border: none;
      padding: 5px 12px; border-radius: 6px; font-weight: bold;
      font-size: 12px; cursor: pointer;
    }
    .btn-join { background: #28a745; }
    .room-input {
      background: #0d111a; border: 1px solid #555; color: #fff;
      padding: 5px 8px; border-radius: 6px; width: 110px;
      font-size: 12px; text-align: center;
    }
    #status-text { color: #ffbc00; font-size: 11px; }

    #stage-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 540px;
      background: #111;
      display: block;
    }

    /* On-Screen Touch Controls */
    #touch-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }
    .t-btn {
      pointer-events: auto;
      touch-action: none;
    }
    /* D-PAD */
    .dpad {
      position: absolute;
      left: 15px;
      bottom: 20px;
      display: flex;
      gap: 14px;
    }
    .dp-key {
      width: 58px;
      height: 58px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      font-size: 22px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dp-key:active, .dp-key.active { background: rgba(255, 57, 72, 0.85); }

    /* ACTION BUTTONS */
    .actions {
      position: absolute;
      right: 15px;
      bottom: 20px;
      display: flex;
      gap: 16px;
    }
    .act-key {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act-key.punch { background: rgba(255, 57, 72, 0.6); border-color: #ff3948; }
    .act-key.kick { background: rgba(255, 188, 0, 0.6); border-color: #ffbc00; }
    .act-key:active, .act-key.active { transform: scale(0.92); filter: brightness(1.3); }
  </style>
</head>
<body>

  <header>
    <div class="title">Street Brawler 2P</div>
    <div class="header-actions">
      <button class="btn-mic" id="btn-mic" onclick="toggleMic()">🎤 Mic: ON</button>
      <button class="btn-fs" onclick="toggleFullScreen()">⛶ Fullscreen</button>
      <a href="index.html" class="btn-back">← Back</a>
    </div>
  </header>

  <div id="room-bar">
    <button class="btn-m" id="btn-host" onclick="createRoom()">👑 Create Room</button>
    <input type="text" id="join-code" class="room-input" placeholder="Room Code">
    <button class="btn-m btn-join" id="btn-join" onclick="joinRoom()">🎮 Join Room</button>
    <span id="status-text">Device 1: Create | Device 2: Join</span>
  </div>

  <div id="stage-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- Audio Element for Player 2 / Host Voice -->
    <audio id="remote-audio" autoplay playsinline></audio>

    <div id="touch-controls">
      <div class="dpad">
        <div class="dp-key t-btn" id="btn-left">◀</div>
        <div class="dp-key t-btn" id="btn-right">▶</div>
      </div>
      <div class="actions">
        <div class="act-key t-btn" id="btn-jump">JUMP</div>
        <div class="act-key kick t-btn" id="btn-kick">KICK</div>
        <div class="act-key punch t-btn" id="btn-punch">PUNCH</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Firebase Config
    const firebaseConfig = {
      databaseURL: "https://arcadeplay-multiplayer-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let roomId = null;
    let myPlayer = null; // 'p1' or 'p2'
    let roomRef = null;

    // WebRTC Voice Chat Variables
    let peer = null;
    let localStream = null;
    let isMuted = false;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gameState = {
      p1: { x: 150, y: 360, vx: 0, vy: 0, hp: 100, isPunch: false, isKick: false, isJumping: false, facing: 'right' },
      p2: { x: 750, y: 360, vx: 0, vy: 0, hp: 100, isPunch: false, isKick: false, isJumping: false, facing: 'left' }
    };

    const keys = { left: false, right: false };

    // Initialize Mic for Voice Chat
    async function initVoiceChat(isHost) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById('btn-mic').style.display = 'block';

        const peerId = isHost ? roomId : roomId + '-p2';
        peer = new Peer(peerId);

        peer.on('call', (call) => {
          call.answer(localStream);
          call.on('stream', (remoteStream) => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play().catch(()=>{});
          });
        });

        // Client calls Host
        if (!isHost) {
          const call = peer.call(roomId, localStream);
          call.on('stream', (remoteStream) => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play().catch(()=>{});
          });
        }
      } catch (err) {
        console.log('Microphone access denied or error:', err);
      }
    }

    function toggleMic() {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
        const btn = document.getElementById('btn-mic');
        btn.innerText = isMuted ? '🔇 Mic: OFF' : '🎤 Mic: ON';
        if (isMuted) btn.classList.add('muted');
        else btn.classList.remove('muted');
      }
    }

    function createRoom() {
      roomId = 'fight-' + Math.floor(1000 + Math.random() * 9000);
      myPlayer = 'p1';
      roomRef = db.ref('rooms/' + roomId);

      roomRef.set({
        state: gameState,
        status: 'waiting'
      });

      document.getElementById('status-text').innerHTML = 'Room: <b style="color:#00ff99;font-size:14px;">' + roomId + '</b>';
      hideRoomBar();
      listenToRoom();
      initVoiceChat(true);
    }

    function joinRoom() {
      const code = document.getElementById('join-code').value.trim();
      if (!code) {
        alert('Enter a valid Room Code!');
        return;
      }
      roomId = code;
      myPlayer = 'p2';
      roomRef = db.ref('rooms/' + roomId);

      roomRef.once('value', (snap) => {
        if (!snap.exists()) {
          alert('Room not found! Check code.');
          return;
        }
        roomRef.update({ status: 'playing' });
        document.getElementById('status-text').innerText = 'Connected! Player 2 (Right).';
        hideRoomBar();
        listenToRoom();
        initVoiceChat(false);
      });
    }

    function hideRoomBar() {
      document.getElementById('btn-host').style.display = 'none';
      document.getElementById('btn-join').style.display = 'none';
      document.getElementById('join-code').style.display = 'none';
    }

    function listenToRoom() {
      const opp = myPlayer === 'p1' ? 'p2' : 'p1';
      roomRef.child('state/' + opp).on('value', (snap) => {
        const val = snap.val();
        if (val) {
          gameState[opp] = val;
        }
      });
    }

    function broadcastMyState() {
      if (roomRef && myPlayer) {
        roomRef.child('state/' + myPlayer).set(gameState[myPlayer]);
      }
    }

    function bindTouch(id, onDown, onUp) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); el.classList.add('active'); onDown(); }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('active'); onUp(); }, { passive: false });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); el.classList.add('active'); onDown(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); el.classList.remove('active'); onUp(); });
    }

    bindTouch('btn-left', () => { keys.left = true; }, () => { keys.left = false; });
    bindTouch('btn-right', () => { keys.right = true; }, () => { keys.right = false; });
    
    bindTouch('btn-jump', () => {
      if (!myPlayer) return;
      if (!gameState[myPlayer].isJumping) {
        gameState[myPlayer].vy = -16;
        gameState[myPlayer].isJumping = true;
        broadcastMyState();
      }
    }, () => {});

    bindTouch('btn-punch', () => {
      if (!myPlayer) return;
      gameState[myPlayer].isPunch = true;
      checkHit('punch');
      broadcastMyState();
      setTimeout(() => { gameState[myPlayer].isPunch = false; broadcastMyState(); }, 250);
    }, () => {});

    bindTouch('btn-kick', () => {
      if (!myPlayer) return;
      gameState[myPlayer].isKick = true;
      checkHit('kick');
      broadcastMyState();
      setTimeout(() => { gameState[myPlayer].isKick = false; broadcastMyState(); }, 300);
    }, () => {});

    function checkHit(type) {
      const me = gameState[myPlayer];
      const oppKey = myPlayer === 'p1' ? 'p2' : 'p1';
      const opp = gameState[oppKey];

      const dist = Math.abs(me.x - opp.x);
      if (dist < 85 && Math.abs(me.y - opp.y) < 50) {
        const dmg = type === 'punch' ? 6 : 10;
        opp.hp = Math.max(0, opp.hp - dmg);
        roomRef.child('state/' + oppKey + '/hp').set(opp.hp);
      }
    }

    function update() {
      if (myPlayer) {
        const p = gameState[myPlayer];
        if (keys.left) {
          p.x = Math.max(60, p.x - 6);
          p.facing = 'left';
        }
        if (keys.right) {
          p.x = Math.min(900, p.x + 6);
          p.facing = 'right';
        }

        // Gravity
        p.y += p.vy;
        p.vy += 0.9;
        if (p.y >= 360) {
          p.y = 360;
          p.vy = 0;
          p.isJumping = false;
        }

        if (keys.left || keys.right || p.isJumping) {
          broadcastMyState();
        }
      }
    }

    function drawFighter(p, color, name) {
      ctx.save();
      ctx.translate(p.x, p.y);

      // Name & HP above player
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(name, -24, -95);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 50, 30, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body (Torso)
      ctx.fillStyle = color;
      ctx.fillRect(-18, -60, 36, 60);

      // Head
      ctx.fillStyle = '#ffd1a4';
      ctx.beginPath();
      ctx.arc(0, -78, 16, 0, Math.PI * 2);
      ctx.fill();

      // Legs
      ctx.fillStyle = '#222';
      ctx.fillRect(-16, 0, 12, 50);
      ctx.fillRect(4, 0, 12, 50);

      // Attack Animations
      const dir = p.facing === 'right' ? 1 : -1;
      if (p.isPunch) {
        ctx.fillStyle = '#ffd1a4';
        ctx.fillRect(dir * 10, -45, dir * 45, 14);
      } else if (p.isKick) {
        ctx.fillStyle = '#222';
        ctx.fillRect(dir * 10, 5, dir * 55, 16);
      } else {
        ctx.fillStyle = color;
        ctx.fillRect(-24, -55, 10, 35);
        ctx.fillRect(14, -55, 10, 35);
      }

      ctx.restore();
    }

    function render() {
      // Background
      ctx.fillStyle = '#141829';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Buildings
      ctx.fillStyle = '#1c2238';
      ctx.fillRect(100, 120, 140, 260);
      ctx.fillRect(300, 80, 180, 300);
      ctx.fillRect(560, 140, 160, 240);
      ctx.fillRect(780, 100, 130, 280);

      // Street Floor
      ctx.fillStyle = '#2b3044';
      ctx.fillRect(0, 410, canvas.width, 130);
      ctx.fillStyle = '#ff3948';
      ctx.fillRect(0, 410, canvas.width, 6);

      // P1 Health Bar
      ctx.fillStyle = '#333';
      ctx.fillRect(40, 30, 350, 24);
      ctx.fillStyle = '#00ff99';
      ctx.fillRect(40, 30, (gameState.p1.hp / 100) * 350, 24);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.fillText('PLAYER 1', 40, 24);

      // P2 Health Bar
      ctx.fillStyle = '#333';
      ctx.fillRect(570, 30, 350, 24);
      ctx.fillStyle = '#ff3948';
      ctx.fillRect(570 + (350 - (gameState.p2.hp / 100) * 350), 30, (gameState.p2.hp / 100) * 350, 24);
      ctx.fillStyle = '#fff';
      ctx.fillText('PLAYER 2', 840, 24);

      // Draw Fighters
      drawFighter(gameState.p1, '#00ff99', 'PLAYER 1');
      drawFighter(gameState.p2, '#ff3948', 'PLAYER 2');

      // Win Condition
      if (gameState.p1.hp <= 0 || gameState.p2.hp <= 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffbc00';
        ctx.font = 'bold 36px Arial';
        const winner = gameState.p1.hp <= 0 ? 'PLAYER 2 WINS!' : 'PLAYER 1 WINS!';
        ctx.fillText(winner, 320, 270);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    function toggleFullScreen() {
      const el = document.getElementById('stage-container');
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    }
  </script>
</body>
</html>
