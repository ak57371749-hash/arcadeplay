<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadillacs &amp; Dinosaurs (2-Player Online Co-op) - ArcadePlay</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background-color: #080a12;
      overflow: hidden;
      display: flex; flex-direction: column;
      font-family: Arial, sans-serif; color: #fff;
    }
    header {
      width: 100%; height: 44px;
      background: #111522; border-bottom: 1px solid #252938;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 12px; z-index: 30;
    }
    header span { color: #ff3948; font-size: 13px; font-weight: bold; }
    header a { color: #bbb; text-decoration: none; font-size: 12px; }
    
    #multiplayer-controls {
      background: #181d2d; border-bottom: 1px solid #2e354b;
      padding: 8px 12px; display: flex; flex-wrap: wrap;
      gap: 8px; align-items: center; justify-content: center;
      z-index: 25; font-size: 13px;
    }
    .btn-m {
      background: #f32e40; color: #fff; border: none;
      padding: 6px 12px; border-radius: 6px; font-weight: bold;
      font-size: 12px; cursor: pointer;
    }
    .btn-join { background: #28a745; }
    .room-input {
      background: #0d111a; border: 1px solid #444; color: #fff;
      padding: 5px 8px; border-radius: 6px; width: 120px; font-size: 12px;
      text-align: center;
    }
    #status-msg { width: 100%; text-align: center; font-size: 11px; color: #ffbc00; }

    #game-container {
      flex: 1; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      position: relative; background: #000;
    }
    #game { width: 100%; height: 100%; max-width: 960px; max-height: 720px; }
    
    /* Stream for Client/Player 2 */
    #client-view {
      display: none; width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }
  </style>
</head>
<body>

  <header>
    <span>Dino 2P Online Co-op</span>
    <a href="index.html">← Back to Arcade</a>
  </header>

  <div id="multiplayer-controls">
    <button class="btn-m" id="host-btn" onclick="initHost()">👑 Host Game (P1)</button>
    <input type="text" id="room-input" class="room-input" placeholder="Room Code">
    <button class="btn-m btn-join" id="join-btn" onclick="initJoin()">🎮 Join Game (P2)</button>
    <div id="status-msg">Click Host or enter code to Join</div>
  </div>

  <div id="game-container">
    <div id="game"></div>
    <video id="client-view" autoplay playsinline></video>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let isHost = false;

    // EmulatorJS config
    window.EJS_player = '#game';
    window.EJS_core = 'arcade';
    window.EJS_gameName = 'dino';
    window.EJS_gameUrl = 'dino.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    // 1. Host Game (Player 1)
    function initHost() {
      const code = 'dino-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('status-msg').innerText = 'Creating room...';
      
      peer = new Peer(code);
      peer.on('open', (id) => {
        isHost = true;
        document.getElementById('status-msg').innerHTML = 'Room Created! Code: <b style="color:#00ff99;font-size:14px;">' + id + '</b> (Share with Player 2)';
        document.getElementById('host-btn').style.display = 'none';
        document.getElementById('join-btn').style.display = 'none';
        document.getElementById('room-input').style.display = 'none';
      });

      peer.on('connection', (c) => {
        conn = c;
        document.getElementById('status-msg').innerText = 'Player 2 Connected! Ready to play.';
        
        // Listen for Player 2 input keys
        conn.on('data', (data) => {
          if (data && data.type === 'keydown') {
            simulateKey(data.key, true);
          } else if (data && data.type === 'keyup') {
            simulateKey(data.key, false);
          }
        });

        // Stream canvas video to Player 2
        const canvas = document.querySelector('#game canvas');
        if (canvas && canvas.captureStream) {
          const stream = canvas.captureStream(30);
          peer.call(conn.peer, stream);
        }
      });
    }

    // 2. Join Game (Player 2)
    function initJoin() {
      const targetRoom = document.getElementById('room-input').value.trim();
      if (!targetRoom) {
        alert('Please enter a Room Code first!');
        return;
      }
      document.getElementById('status-msg').innerText = 'Connecting to Host...';
      
      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(targetRoom);
        conn.on('open', () => {
          document.getElementById('status-msg').innerText = 'Connected! You are Player 2 (Controls active).';
          document.getElementById('host-btn').style.display = 'none';
          document.getElementById('join-btn').style.display = 'none';
          document.getElementById('room-input').style.display = 'none';
          
          // Switch to video stream view for client
          document.getElementById('game').style.display = 'none';
          document.getElementById('client-view').style.display = 'block';
        });
      });

      // Receive Host video stream
      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          const video = document.getElementById('client-view');
          video.srcObject = remoteStream;
          video.play();
        });
      });
    }

    // Simulate Keyboard events for Player 2 into Emulator
    function simulateKey(code, isPress) {
      const eventType = isPress ? 'keydown' : 'keyup';
      const event = new KeyboardEvent(eventType, {
        bubbles: true,
        cancelable: true,
        code: code,
        keyCode: getKeyCode(code)
      });
      window.dispatchEvent(event);
      document.dispatchEvent(event);
      const canvas = document.querySelector('#game canvas');
      if (canvas) canvas.dispatchEvent(event);
    }

    function getKeyCode(code) {
      const map = { 'KeyS': 83, 'KeyX': 88, 'KeyZ': 90, 'KeyA': 65, 'Digit6': 54, 'Digit2': 50 };
      return map[code] || 0;
    }
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
