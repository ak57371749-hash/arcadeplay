<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadillacs &amp; Dinosaurs - 2-Player Co-op</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background-color: #080a12;
      overflow: hidden;
      display: flex; flex-direction: column;
      font-family: Arial, sans-serif;
    }
    header {
      width: 100%; height: 42px;
      background: #111522; border-bottom: 1px solid #252938;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 12px; z-index: 20;
    }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    header span { color: #ff3948; font-size: 13px; font-weight: bold; }
    .btn-fs {
      background: #ff3948; color: #fff; border: none;
      padding: 5px 10px; border-radius: 5px; font-size: 12px;
      font-weight: bold; cursor: pointer;
    }
    .btn-back { color: #bbb; text-decoration: none; font-size: 12px; }

    #room-bar {
      background: #181d2d; border-bottom: 1px solid #2e354b;
      padding: 6px 12px; display: flex; gap: 8px;
      align-items: center; justify-content: center;
      font-size: 12px; z-index: 20;
    }
    .btn-m {
      background: #f32e40; color: #fff; border: none;
      padding: 5px 10px; border-radius: 5px; font-weight: bold;
      font-size: 12px; cursor: pointer;
    }
    .btn-join { background: #28a745; }
    .room-input {
      background: #0d111a; border: 1px solid #555; color: #fff;
      padding: 4px 8px; border-radius: 5px; width: 110px;
      font-size: 12px; text-align: center;
    }
    #status-text { color: #ffbc00; font-size: 11px; margin-left: 6px; }

    #game-container {
      width: 100%; flex: 1;
      display: flex; justify-content: center; align-items: center;
      background-color: #000; position: relative;
    }
    #game { width: 100%; height: 100%; max-width: 960px; max-height: 720px; }
  </style>
</head>
<body>

  <header>
    <span>Dino 2P Online Co-op</span>
    <div class="nav-actions">
      <button class="btn-fs" onclick="toggleFullScreen()">⛶ Fullscreen</button>
      <a href="index.html" class="btn-back">← Back</a>
    </div>
  </header>

  <div id="room-bar">
    <button class="btn-m" id="host-btn" onclick="setupHost()">👑 Host (P1)</button>
    <input type="text" id="room-code" class="room-input" placeholder="Room Code">
    <button class="btn-m btn-join" id="join-btn" onclick="setupJoin()">🎮 Join (P2)</button>
    <span id="status-text">Ready</span>
  </div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <!-- PeerJS library loaded asynchronously so emulator is not blocked -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    function toggleFullScreen() {
      const container = document.getElementById('game-container');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Identical core settings as the working dino.html
    window.EJS_player = '#game';
    window.EJS_core = 'arcade';
    window.EJS_gameName = 'dino';
    window.EJS_gameUrl = 'dino.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    // WebRTC Sync Layer
    let peer = null;
    let conn = null;

    function setupHost() {
      const code = 'dino-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('status-text').innerText = 'Creating...';
      peer = new Peer(code);
      peer.on('open', (id) => {
        document.getElementById('status-text').innerHTML = 'Code: <b style="color:#00ff99;">' + id + '</b>';
        document.getElementById('host-btn').style.display = 'none';
        document.getElementById('join-btn').style.display = 'none';
        document.getElementById('room-code').style.display = 'none';
      });

      peer.on('connection', (c) => {
        conn = c;
        document.getElementById('status-text').innerText = 'Player 2 Connected!';
        conn.on('data', (data) => {
          if (data && data.key) {
            triggerKey(data.key, data.down);
          }
        });
      });
    }

    function setupJoin() {
      const target = document.getElementById('room-code').value.trim();
      if (!target) {
        alert('Please enter Room Code!');
        return;
      }
      document.getElementById('status-text').innerText = 'Connecting...';
      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(target);
        conn.on('open', () => {
          document.getElementById('status-text').innerText = 'Connected as P2!';
          document.getElementById('host-btn').style.display = 'none';
          document.getElementById('join-btn').style.display = 'none';
          document.getElementById('room-code').style.display = 'none';
          forwardInputs();
        });
      });
    }

    function forwardInputs() {
      window.addEventListener('keydown', (e) => {
        if (conn && conn.open) conn.send({ key: e.code, down: true });
      });
      window.addEventListener('keyup', (e) => {
        if (conn && conn.open) conn.send({ key: e.code, down: false });
      });
    }

    function triggerKey(code, isDown) {
      const evt = new KeyboardEvent(isDown ? 'keydown' : 'keyup', {
        bubbles: true, cancelable: true, code: code, key: code
      });
      window.dispatchEvent(evt);
      document.dispatchEvent(evt);
      const canvas = document.querySelector('#game canvas');
      if (canvas) canvas.dispatchEvent(evt);
    }
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
