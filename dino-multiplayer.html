<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadillacs &amp; Dinosaurs (2-Player Online) - ArcadePlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #080a12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    header {
      width: 100%;
      padding: 8px 16px;
      background: #111522;
      border-bottom: 1px solid #252938;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
    }
    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    header span {
      color: #ff3948;
      font-size: 13px;
      font-weight: bold;
    }
    .btn-fs {
      background: #ff3948;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-back {
      color: #bbb;
      text-decoration: none;
      font-size: 12px;
    }
    #game-container {
      width: 100%;
      height: 100%;
      padding-top: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }
    #game {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 720px;
    }
  </style>
</head>
<body>

  <header>
    <span>Cadillacs &amp; Dinosaurs (Auto-Load Co-op)</span>
    <div class="nav-actions">
      <button class="btn-fs" onclick="toggleFullScreen()">⛶ Fullscreen</button>
      <a href="index.html" class="btn-back">← Back</a>
    </div>
  </header>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    function toggleFullScreen() {
      const container = document.getElementById('game-container');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Direct Hosted ROM auto-load
    window.EJS_player = '#game';
    window.EJS_core = 'arcade';
    window.EJS_gameName = 'dino';
    window.EJS_gameUrl = 'dino.zip'; // GitHub se direct load hoga
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    
    // Netplay / P2P Server Settings
    window.EJS_netplayUrl = 'https://netplay.emulatorjs.org';
    window.EJS_netplayServer = 'https://netplay.emulatorjs.org';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
