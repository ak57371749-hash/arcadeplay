<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadillacs &amp; Dinosaurs - 2-Player Co-op</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    header {
      width: 100%;
      height: 38px;
      background: #111522;
      border-bottom: 1px solid #252938;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 50;
    }
    .header-left { color: #ff3948; font-size: 13px; font-weight: bold; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-fs {
      background: #ff3948; color: #fff; border: none;
      padding: 4px 10px; border-radius: 5px; font-size: 12px;
      font-weight: bold; cursor: pointer;
    }
    .btn-back { color: #bbb; text-decoration: none; font-size: 12px; }

    #room-bar {
      background: #181d2d;
      border-bottom: 1px solid #2e354b;
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 45;
    }
    .btn-m {
      background: #f32e40; color: #fff; border: none;
      padding: 5px 12px; border-radius: 6px; font-weight: bold;
      font-size: 12px; cursor: pointer;
    }
    .btn-join { background: #28a745; }
    .room-input {
      background: #0d111a; border: 1px solid #555; color: #fff;
      padding: 5px 8px; border-radius: 6px; width: 110px;
      font-size: 12px; text-align: center;
    }
    #status-text { color: #ffbc00; font-size: 11px; }

    #viewport {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 720px;
    }
    #p2-screen {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    /* Player 2 On-Screen Touch Controls */
    #p2-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      touch-action: none;
    }

    /* D-PAD (Left) */
    .dpad-container {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 136px;
      height: 136px;
    }
    .dpad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: rgba(255, 57, 72, 0.8); }
    .btn-up { top: 0; left: 46px; }
    .btn-down { bottom: 0; left: 46px; }
    .btn-left { top: 46px; left: 0; }
    .btn-right { top: 46px; right: 0; }

    /* ACTION BUTTONS (Right) */
    .action-container {
      position: absolute;
      right: 14px;
      bottom: 18px;
      display: flex;
      gap: 14px;
    }
    .act-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act-circle.att {
      background: rgba(255, 57, 72, 0.5);
      border-color: #ff3948;
    }
    .act-circle:active { transform: scale(0.92); }

    /* COIN & START (Top Center) */
    .sys-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .sys-pill {
      background: rgba(17, 21, 34, 0.85);
      border: 1px solid #ff3948;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .sys-pill:active { background: #ff3948; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">Dino 2P Co-op</div>
    <div class="header-actions">
      <button class="btn-fs" onclick="toggleFullScreen()">⛶ Fullscreen</button>
      <a href="index.html" class="btn-back">← Back</a>
    </div>
  </header>

  <div id="room-bar">
    <button class="btn-m" id="host-btn" onclick="startHost()">👑 Host (P1)</button>
    <input type="text" id="room-code" class="room-input" placeholder="Room Code">
    <button class="btn-m btn-join" id="join-btn" onclick="startJoin()">🎮 Join (P2)</button>
    <span id="status-text">Device 1: Host dabao | Device 2: Code dalkar Join dabao</span>
  </div>

  <div id="viewport">
    <!-- Emulator container (Device 1 Host) -->
    <div id="game"></div>

    <!-- Live Stream Screen (Device 2 Client) -->
    <video id="p2-screen" autoplay playsinline muted></video>

    <!-- Player 2 Touch Gamepad -->
    <div id="p2-controls">
      <div class="dpad-container">
        <div class="dpad-btn btn-up touch-btn" data-key="ArrowUp">▲</div>
        <div class="dpad-btn btn-down touch-btn" data-key="ArrowDown">▼</div>
        <div class="dpad-btn btn-left touch-btn" data-key="ArrowLeft">◀</div>
        <div class="dpad-btn btn-right touch-btn" data-key="ArrowRight">▶</div>
      </div>

      <div class="sys-container">
        <button class="sys-pill touch-btn" data-key="Digit6">🪙 INSERT COIN</button>
        <button class="sys-pill touch-btn" data-key="Digit2">START 2P</button>
      </div>

      <div class="action-container">
        <div class="act-circle touch-btn" data-key="KeyS">JUMP</div>
        <div class="act-circle att touch-btn" data-key="KeyA">ATTACK</div>
      </div>
    </div>
  </div>

  <!-- PeerJS WebRTC Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

  <!-- EmulatorJS Configuration (Always load directly so game never freezes) -->
  <script>
    function toggleFullScreen() {
      const el = document.getElementById('viewport');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    window.EJS_player = '#game';
    window.EJS_core = 'arcade';
    window.EJS_gameName = 'dino';
    window.EJS_gameUrl = 'dino.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    let peer = null;
    let conn = null;

    // 1. Host Game (Device 1)
    function startHost() {
      if (typeof Peer === 'undefined') {
        alert('Network library loading, please wait 3 seconds and tap again.');
        return;
      }
      const code = 'dino' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('status-text').innerText = 'Creating room...';

      peer = new Peer(code);
      peer.on('open', (id) => {
        document.getElementById('status-text').innerHTML = 'Room Code: <b style="color:#00ff99;font-size:13px;">' + id + '</b>';
        hideRoomBar();
      });

      peer.on('error', (err) => {
        document.getElementById('status-text').innerText = 'Error: ' + err.type;
      });

      peer.on('connection', (c) => {
        conn = c;
        document.getElementById('status-text').innerText = 'Player 2 Connected! Ready.';

        conn.on('data', (data) => {
          if (data && data.key) {
            injectKeyToHost(data.key, data.down);
          }
        });

        // Start video stream to Player 2
        const checkCanvas = setInterval(() => {
          const canvas = document.querySelector('#game canvas');
          if (canvas && canvas.captureStream) {
            clearInterval(checkCanvas);
            const stream = canvas.captureStream(30);
            peer.call(conn.peer, stream);
          }
        }, 500);
      });
    }

    // 2. Join Game (Device 2)
    function startJoin() {
      if (typeof Peer === 'undefined') {
        alert('Network library loading, please wait 3 seconds and tap again.');
        return;
      }
      const target = document.getElementById('room-code').value.trim();
      if (!target) {
        alert('Please enter Room Code first!');
        return;
      }
      document.getElementById('status-text').innerText = 'Connecting to Host...';

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(target);
        conn.on('open', () => {
          document.getElementById('status-text').innerText = 'Connected! Use controls below to play.';
          hideRoomBar();

          // Stop local canvas, show video stream & controls
          document.getElementById('game').style.display = 'none';
          document.getElementById('p2-screen').style.display = 'block';
          document.getElementById('p2-controls').style.display = 'block';

          bindP2Controls();
        });
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (stream) => {
          const video = document.getElementById('p2-screen');
          video.srcObject = stream;
          video.play();
        });
      });
    }

    function hideRoomBar() {
      document.getElementById('host-btn').style.display = 'none';
      document.getElementById('join-btn').style.display = 'none';
      document.getElementById('room-code').style.display = 'none';
    }

    function bindP2Controls() {
      document.querySelectorAll('.touch-btn').forEach(btn => {
        const key = btn.getAttribute('data-key');
        const send = (isDown) => {
          if (conn && conn.open) conn.send({ key: key, down: isDown });
        };

        btn.addEventListener('touchstart', (e) => { e.preventDefault(); send(true); }, { passive: false });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); send(false); }, { passive: false });
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); send(true); });
        btn.addEventListener('mouseup', (e) => { e.preventDefault(); send(false); });
      });
    }

    // Injects Player 2 keys into Host Emulator
    function injectKeyToHost(code, isDown) {
      const p2Map = {
        'Digit6': 'Digit6', // Coin 2
        'Digit2': 'Digit2', // Start 2
        'ArrowUp': 'KeyR',
        'ArrowDown': 'KeyF',
        'ArrowLeft': 'KeyD',
        'ArrowRight': 'KeyG',
        'KeyA': 'KeyA',     // Attack 2
        'KeyS': 'KeyS'      // Jump 2
      };

      const mapped = p2Map[code] || code;
      const evt = new KeyboardEvent(isDown ? 'keydown' : 'keyup', {
        bubbles: true, cancelable: true, code: mapped, key: mapped
      });
      window.dispatchEvent(evt);
      document.dispatchEvent(evt);
      const canvas = document.querySelector('#game canvas');
      if (canvas) canvas.dispatchEvent(evt);
    }
  </script>

  <!-- Static Loader: Game will always load immediately -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
