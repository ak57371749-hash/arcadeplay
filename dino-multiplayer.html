<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadillacs &amp; Dinosaurs (2-Player Online Co-op)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background-color: #080a12;
      overflow: hidden;
      display: flex; flex-direction: column;
      font-family: Arial, sans-serif; color: #fff;
    }
    header {
      width: 100%; height: 42px;
      background: #111522; border-bottom: 1px solid #252938;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 12px; z-index: 30;
    }
    header span { color: #ff3948; font-size: 13px; font-weight: bold; }
    header a { color: #bbb; text-decoration: none; font-size: 12px; }
    
    #multiplayer-controls {
      background: #181d2d; border-bottom: 1px solid #2e354b;
      padding: 6px 12px; display: flex; flex-wrap: wrap;
      gap: 8px; align-items: center; justify-content: center;
      z-index: 25; font-size: 12px;
    }
    .btn-m {
      background: #f32e40; color: #fff; border: none;
      padding: 6px 12px; border-radius: 6px; font-weight: bold;
      font-size: 12px; cursor: pointer;
    }
    .btn-join { background: #28a745; }
    .room-input {
      background: #0d111a; border: 1px solid #444; color: #fff;
      padding: 5px 8px; border-radius: 6px; width: 120px; font-size: 12px;
      text-align: center;
    }
    #status-msg { width: 100%; text-align: center; font-size: 11px; color: #ffbc00; }

    #game-container {
      flex: 1; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      position: relative; background: #000;
    }
    #game { width: 100%; height: 100%; max-width: 960px; max-height: 720px; }
    
    #client-view {
      display: none; width: 100%; height: 100%;
      object-fit: contain; background: #000;
      position: absolute; top: 0; left: 0; z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <span>Dino 2P Co-op (Original Gamepad)</span>
    <a href="index.html">← Back to Arcade</a>
  </header>

  <div id="multiplayer-controls">
    <button class="btn-m" id="host-btn" onclick="initHost()">👑 Host Game (P1)</button>
    <input type="text" id="room-input" class="room-input" placeholder="Room Code">
    <button class="btn-m btn-join" id="join-btn" onclick="initJoin()">🎮 Join Game (P2)</button>
    <div id="status-msg">Click Host (Device 1) or enter code to Join (Device 2)</div>
  </div>

  <div id="game-container">
    <div id="game"></div>
    <!-- P2 Video Screen Overlay -->
    <video id="client-view" autoplay playsinline muted></video>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let myRole = 'none';

    // EmulatorJS Settings
    window.EJS_player = '#game';
    window.EJS_core = 'arcade';
    window.EJS_gameName = 'dino';
    window.EJS_gameUrl = 'dino.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    // 1. Host Game (Player 1)
    function initHost() {
      myRole = 'host';
      const code = 'dino-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('status-msg').innerText = 'Creating room...';
      
      peer = new Peer(code);
      peer.on('open', (id) => {
        document.getElementById('status-msg').innerHTML = 'Room Code: <b style="color:#00ff99;font-size:14px;">' + id + '</b> (Share with Player 2)';
        hideRoomBar();
      });

      peer.on('connection', (c) => {
        conn = c;
        document.getElementById('status-msg').innerText = 'Player 2 Connected! Both can now play.';
        
        // Host receives Player 2's inputs from their original gamepad
        conn.on('data', (data) => {
          if (data && data.btn !== undefined) {
            handleRemotePlayer2Input(data.btn, data.pressed);
          }
        });

        // Stream canvas video to Player 2
        setTimeout(() => {
          const canvas = document.querySelector('#game canvas');
          if (canvas && canvas.captureStream) {
            const stream = canvas.captureStream(30);
            peer.call(conn.peer, stream);
          }
        }, 1500);
      });
    }

    // 2. Join Game (Player 2)
    function initJoin() {
      const targetRoom = document.getElementById('room-input').value.trim();
      if (!targetRoom) {
        alert('Please enter a Room Code first!');
        return;
      }
      myRole = 'client';
      document.getElementById('status-msg').innerText = 'Connecting to Host...';
      
      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(targetRoom);
        conn.on('open', () => {
          document.getElementById('status-msg').innerText = 'Connected! Use your on-screen buttons to control Player 2.';
          hideRoomBar();
          
          // Switch to video stream from Host
          document.getElementById('client-view').style.display = 'block';
          
          // Intercept Player 2's EmulatorJS gamepad buttons
          interceptLocalGamepad();
        });
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          const video = document.getElementById('client-view');
          video.srcObject = remoteStream;
          video.play();
        });
      });
    }

    function hideRoomBar() {
      document.getElementById('host-btn').style.display = 'none';
      document.getElementById('join-btn').style.display = 'none';
      document.getElementById('room-input').style.display = 'none';
    }

    // Intercept original EmulatorJS on-screen touch gamepad on Device 2
    function interceptLocalGamepad() {
      const sendInput = (btnId, isPressed) => {
        if (conn && conn.open) {
          conn.send({ btn: btnId, pressed: isPressed });
        }
      };

      // Poll browser/emulator gamepad events or touch inputs
      const checkButtons = () => {
        const touchBtns = document.querySelectorAll('.ejs_control, [class*="ejs_button"], [class*="ejs_dpad"]');
        if (touchBtns.length > 0) {
          touchBtns.forEach((btn, index) => {
            btn.addEventListener('touchstart', () => sendInput(index, true), { passive: false });
            btn.addEventListener('touchend', () => sendInput(index, false), { passive: false });
          });
        } else {
          setTimeout(checkButtons, 500);
        }
      };
      checkButtons();

      // Keyboard fallback if playing on PC/keyboard
      window.addEventListener('keydown', (e) => {
        if (conn && conn.open) conn.send({ btn: e.code, pressed: true });
      });
      window.addEventListener('keyup', (e) => {
        if (conn && conn.open) conn.send({ btn: e.code, pressed: false });
      });
    }

    // Host injects Player 2 inputs directly into RetroArch/Core Port 2
    function handleRemotePlayer2Input(btn, isPressed) {
      // CPS1 Player 2 keycodes mapping
      // Start: Enter (2), Coin: 6, Left: D, Right: G, Up: R, Down: F, Attack: A, Jump: S
      const p2Map = {
        'Digit2': 'Digit2',
        'Digit6': 'Digit6',
        'ArrowUp': 'KeyR',
        'ArrowDown': 'KeyF',
        'ArrowLeft': 'KeyD',
        'ArrowRight': 'KeyG',
        'KeyZ': 'KeyA',
        'KeyX': 'KeyS'
      };

      let mappedKey = p2Map[btn] || btn;
      const eventType = isPressed ? 'keydown' : 'keyup';
      
      const evt = new KeyboardEvent(eventType, {
        bubbles: true,
        cancelable: true,
        code: mappedKey,
        key: mappedKey
      });
      
      window.dispatchEvent(evt);
      document.dispatchEvent(evt);
      const canvas = document.querySelector('#game canvas');
      if (canvas) canvas.dispatchEvent(evt);
    }
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
