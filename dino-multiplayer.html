<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadillacs &amp; Dinosaurs - 2-Player Co-op</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    header {
      width: 100%;
      height: 40px;
      background: #111522;
      border-bottom: 1px solid #252938;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 50;
    }
    .header-left { color: #ff3948; font-size: 13px; font-weight: bold; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-fs {
      background: #ff3948; color: #fff; border: none;
      padding: 4px 10px; border-radius: 5px; font-size: 12px;
      font-weight: bold; cursor: pointer;
    }
    .btn-back { color: #bbb; text-decoration: none; font-size: 12px; }

    #room-bar {
      background: #181d2d;
      border-bottom: 1px solid #2e354b;
      padding: 6px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 45;
    }
    .btn-m {
      background: #f32e40; color: #fff; border: none;
      padding: 5px 12px; border-radius: 6px; font-weight: bold;
      font-size: 12px; cursor: pointer;
    }
    .btn-join { background: #28a745; }
    .room-input {
      background: #0d111a; border: 1px solid #555; color: #fff;
      padding: 5px 8px; border-radius: 6px; width: 110px;
      font-size: 12px; text-align: center;
    }
    #status-text { color: #ffbc00; font-size: 11px; }

    #viewport {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    #game-box {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 720px;
    }
    #p2-screen {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Player 2 On-Screen Gamepad */
    #p2-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      touch-action: none;
    }

    /* D-PAD */
    .dpad-container {
      position: absolute;
      left: 15px;
      bottom: 15px;
      width: 140px;
      height: 140px;
    }
    .dpad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: rgba(255, 57, 72, 0.8); }
    .btn-up { top: 0; left: 48px; }
    .btn-down { bottom: 0; left: 48px; }
    .btn-left { top: 48px; left: 0; }
    .btn-right { top: 48px; right: 0; }

    /* ACTION BUTTONS */
    .action-container {
      position: absolute;
      right: 15px;
      bottom: 20px;
      display: flex;
      gap: 15px;
    }
    .act-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act-circle.att {
      background: rgba(255, 57, 72, 0.5);
      border-color: #ff3948;
    }
    .act-circle:active { transform: scale(0.92); }

    /* COIN & START */
    .sys-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .sys-pill {
      background: rgba(17, 21, 34, 0.85);
      border: 1px solid #ff3948;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .sys-pill:active { background: #ff3948; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">Dino 2P Co-op</div>
    <div class="header-actions">
      <button class="btn-fs" onclick="toggleFullScreen()">⛶ Fullscreen</button>
      <a href="index.html" class="btn-back">← Back</a>
    </div>
  </header>

  <div id="room-bar">
    <button class="btn-m" id="host-btn" onclick="startHost()">👑 Host (P1)</button>
    <input type="text" id="room-code" class="room-input" placeholder="Room Code">
    <button class="btn-m btn-join" id="join-btn" onclick="startJoin()">🎮 Join (P2)</button>
    <span id="status-text">Select Host on Device 1 or Join on Device 2</span>
  </div>

  <div id="viewport">
    <!-- Host Screen -->
    <div id="game-box"></div>

    <!-- Client Screen (Player 2 Stream) -->
    <video id="p2-screen" autoplay playsinline></video>

    <!-- Player 2 Virtual Gamepad Overlay -->
    <div id="p2-controls">
      <div class="dpad-container">
        <div class="dpad-btn btn-up touch-btn" data-key="ArrowUp">▲</div>
        <div class="dpad-btn btn-down touch-btn" data-key="ArrowDown">▼</div>
        <div class="dpad-btn btn-left touch-btn" data-key="ArrowLeft">◀</div>
        <div class="dpad-btn btn-right touch-btn" data-key="ArrowRight">▶</div>
      </div>

      <div class="sys-container">
        <button class="sys-pill touch-btn" data-key="Digit6">🪙 INSERT COIN</button>
        <button class="sys-pill touch-btn" data-key="Digit2">START 2P</button>
      </div>

      <div class="action-container">
        <div class="act-circle touch-btn" data-key="KeyS">JUMP</div>
        <div class="act-circle att touch-btn" data-key="KeyA">ATTACK</div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;

    function toggleFullScreen() {
      const el = document.getElementById('viewport');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // 1. Host Setup (Device 1)
    function startHost() {
      const code = 'dino-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('status-text').innerText = 'Creating room...';

      peer = new Peer(code);
      peer.on('open', (id) => {
        document.getElementById('status-text').innerHTML = 'Room Code: <b style="color:#00ff99;font-size:13
